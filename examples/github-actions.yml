name: BlobBudget
on: [pull_request]
jobs:
  bloat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node dist/src/cli.js scan . --out blobbudget.md --fail-on medium
