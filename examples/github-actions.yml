name: BlobBudget
on: [pull_request]
jobs:
  bloat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npx blobbudget scan . --out blobbudget.md --fail-on medium
